<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Read the latest technology news from the PXL community.">
  <title>PXL Tech News</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="PXL Tech News home">PXL<span>Tech</span></a>
      <button class="nav-toggle" type="button" aria-controls="primary-nav" aria-expanded="false">
        <span class="nav-toggle-label">Menu</span>
        <span class="nav-toggle-icon" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
      <nav id="primary-nav" class="primary-nav" aria-label="Main navigation">
        <a href="./#featured">Featured</a>
        <a href="./#latest">Latest news</a>
      </nav>
    </div>
  </header>

  <main class="article-main">
    <a class="back-link" href="./">← Back to all news</a>
    <article id="article" class="article-content" aria-live="polite" aria-busy="true">
      <p class="news-state">Loading article…</p>
    </article>
  </main>

  <footer class="site-footer">
    <p>Independent technology news by the PXL community.</p>
  </footer>
</body>
</html>
