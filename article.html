
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PXL Tech News</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1><a href="./">PXL<span>Tech</span></a></h1>
    <p>Technology. Development. Innovation.</p>
  </header>

  <main>
    <a href="./">← Back to news</a>
    <article id="article">
      Loading article...
    </article>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    fetch("news.json")
      .then(response => response.json())
      .then(articles => {
        const article = articles.find(item => item.id === id);
        const container = document.getElementById("article");

        if (!article) {
          container.textContent = "Article not found.";
          return;
        }

        document.title = article.title + " | PXL Tech News";

        const heading = document.createElement("h2");
        heading.textContent = article.title;

        const category = document.createElement("p");
        category.textContent = article.category;

        const date = document.createElement("small");
        date.textContent = article.date;

        const description = document.createElement("p");
        description.textContent = article.description;

        container.replaceChildren(
          category, heading, date, description
        );

        if (article.source) {
          const link = document.createElement("a");
          link.href = article.source;
          link.textContent = "Read original source";
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          container.appendChild(link);
        }
      })
      .catch(() => {
        document.getElementById("article").textContent =
          "Unable to load article.";
      });
  </script>
</body>
</html>
