
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PXL News Publisher</title>

<style>
:root {
  --bg: #0b0d12;
  --panel: #141824;
  --border: #282e3b;
  --text: #f1f3f8;
  --muted: #929bad;
  --accent: #8b5cf6;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
  padding: 30px 16px;
}

.container {
  max-width: 850px;
  margin: auto;
}

header {
  margin-bottom: 30px;
}

header h1 {
  font-size: 30px;
}

header span {
  color: var(--accent);
}

header p {
  color: var(--muted);
  margin-top: 5px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 24px;
  border-radius: 14px;
  margin-bottom: 20px;
}

h2 {
  font-size: 19px;
  margin-bottom: 20px;
}

label {
  display: block;
  margin: 17px 0 7px;
  font-size: 14px;
  font-weight: 600;
}

input, textarea, select {
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  font: inherit;
  outline: none;
}

input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  background: var(--accent);
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  margin-top: 18px;
}

button:hover {
  opacity: 0.85;
}

.secondary {
  background: #292f3d;
}

.preview {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
  margin-top: 12px;
}

.preview small {
  color: var(--accent);
}

.preview h3 {
  margin: 10px 0;
}

.preview p {
  color: var(--muted);
}

#output {
  min-height: 180px;
  margin-top: 12px;
  font-family: monospace;
  font-size: 13px;
}

.note {
  color: var(--muted);
  font-size: 13px;
  margin-top: 12px;
  line-height: 1.6;
}

.status {
  color: #a78bfa;
  margin-top: 12px;
  font-size: 13px;
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>PXL<span>Tech</span> Publisher</h1>
  <p>Independent technology news by PXL Community.</p>
</header>

<section class="panel">
  <h2>Write an article</h2>

  <form id="newsForm">

    <label for="title">Headline</label>
    <input
      id="title"
      maxlength="150"
      placeholder="Enter news headline"
      required
    >

    <label for="category">Category</label>
    <select id="category" required>
      <option value="AI">AI</option>
      <option value="Programming">Programming</option>
      <option value="Linux">Linux</option>
      <option value="Gaming">Gaming</option>
      <option value="Cybersecurity">Cybersecurity</option>
      <option value="Open Source">Open Source</option>
      <option value="Technology">Technology</option>
    </select>

    <label for="description">News description</label>
    <textarea
      id="description"
      maxlength="2000"
      placeholder="Write your original news article..."
      required
    ></textarea>

    <label for="source">Original source URL</label>
    <input
      id="source"
      type="url"
      placeholder="https://example.com/news"
    >

    <button type="submit">Generate article</button>
    <button type="reset" class="secondary">Clear form</button>

  </form>
</section>

<section class="panel">
  <h2>Live preview</h2>
  <div class="preview">
    <small id="previewCategory">CATEGORY</small>
    <h3 id="previewTitle">Your headline will appear here</h3>
    <p id="previewDescription">Your description will appear here.</p>
    <p class="note" id="previewDate"></p>
  </div>
</section>

<section class="panel">
  <h2>Generated JSON article</h2>

  <textarea id="output" readonly
    placeholder="Your article JSON will appear here..."></textarea>

  <button id="copyButton" type="button">Copy JSON</button>

  <p class="note">
    Copy the generated object and add it to your repository's
    news.json array. Keep existing articles.
  </p>

  <p class="status" id="status" aria-live="polite"></p>
</section>

</div>

<script>
const form = document.getElementById("newsForm");

const fields = {
  title: document.getElementById("title"),
  category: document.getElementById("category"),
  description: document.getElementById("description"),
  source: document.getElementById("source")
};

function createId() {
  return "pxl-" + Date.now().toString(36);
}

function updatePreview() {
  document.getElementById("previewTitle").textContent =
    fields.title.value || "Your headline will appear here";

  document.getElementById("previewCategory").textContent =
    fields.category.value;

  document.getElementById("previewDescription").textContent =
    fields.description.value || "Your description will appear here.";

  document.getElementById("previewDate").textContent =
    new Date().toISOString().slice(0, 10);
}

Object.values(fields).forEach(field => {
  field.addEventListener("input", updatePreview);
  field.addEventListener("change", updatePreview);
});

form.addEventListener("submit", event => {
  event.preventDefault();

  const article = {
    id: createId(),
    title: fields.title.value.trim(),
    description: fields.description.value.trim(),
    category: fields.category.value,
    date: new Date().toISOString().slice(0, 10),
    source: fields.source.value.trim()
  };

  document.getElementById("output").value =
    JSON.stringify(article, null, 2);

  document.getElementById("status").textContent =
    "Article generated successfully!";
});

document.getElementById("copyButton").addEventListener("click", async () => {
  const output = document.getElementById("output");

  if (!output.value) {
    document.getElementById("status").textContent =
      "Generate an article first.";
    return;
  }

  try {
    await navigator.clipboard.writeText(output.value);
    document.getElementById("status").textContent =
      "JSON copied successfully!";
  } catch {
    output.select();
    document.getElementById("status").textContent =
      "Select and copy the JSON manually.";
  }
});

form.addEventListener("reset", () => {
  setTimeout(() => {
    document.getElementById("output").value = "";
    document.getElementById("status").textContent = "";
    updatePreview();
  }, 0);
});

updatePreview();
</script>
</body>
</html>
