name: Publish News Article

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.issue.user.login == 'pxlofficial1-sketch' && startsWith(github.event.issue.title, '[Publish]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish article
        run: python .github/scripts/publish_issue.py

      - name: Confirm and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Published successfully! Your article is now on PXL Tech News."
          gh issue close "$ISSUE_NUMBER"
